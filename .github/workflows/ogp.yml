
name: Generate session OGP pages

on:
  push:
    branches:
      - main
    paths:
      - "sessions.json"
      - "session-detail.html"
      - "generate-ogp.mjs"
      - ".github/workflows/ogp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate pages
        run: node generate-ogp.mjs

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sessions/
          if ! git diff --cached --quiet; then
            git commit -m "Generate session OGP pages"
            git push
          fi
