<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>木人作者KP企画／卓報告</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/crt.css">
<link rel="stylesheet" href="css/page.css">
<style>
.table-wrap {
  max-width: 100%;
  overflow-x: auto;
  margin: 24px auto;
}

table {
  margin: 0 auto;
  border: 1px solid #444;
  border-spacing: 2px;
  background: #fff;
}

th,
td {
  border: 2px inset #999;
  padding: 0 2px;
  background: #fff;
  text-align: left;
  line-height: 1.25;
  vertical-align: middle;
  white-space: nowrap;
}

th {
  font-weight: bold;
} 
</style>
</head>
<body>
<main>
<h1>木人作者KP企画／卓報告</h1>
<p>クリックしてもネタバレはなし</p>
<div class="table-wrap">
<table aria-label="セッションログ一覧">
<thead><tr><th>DATE</th><th>TITLE</th><th>KP／PL</th></tr></thead>
<tbody id="session-rows"><tr><td colspan="3">読み込み中...</td></tr>
</tbody></table>
</div>
<p><a href="index.html">← 戻る</a></p>
<script>
(async () => {
  const tbody = document.getElementById('session-rows');
  try {
    const response = await fetch('./sessions.json');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const sessions = await response.json();
    if (!Array.isArray(sessions)) throw new Error('JSONは配列にしてください');
    tbody.replaceChildren();
    const isLocal = ['localhost', '127.0.0.1']
          .includes(location.hostname);
    for (const session of [...sessions].sort((a,b) => b.date.localeCompare(a.date))) {
      const tr = document.createElement('tr');
      const date = document.createElement('td');
      date.textContent = session.date.replaceAll('-', '/');
      const title = document.createElement('td');
      const link = document.createElement('a');
      const url = isLocal
          ? `session-detail.html?id=${encodeURIComponent(session.id)}`
          : `sessions/${encodeURIComponent(session.id)}.html`;
      link.href = url;      
      link.textContent = session.title;
      title.append(link);
      const members = document.createElement('td');
      members.textContent = 'KP：' + session.kp + '  PL：' + (session.pl || []).join('／');
      tr.append(date, title, members);
      tbody.append(tr);
    }
    if (!sessions.length) tbody.innerHTML = '<tr><td colspan="3">まだ記録がありません</td></tr>';
  } catch (error) {
    tbody.replaceChildren();
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 3;
    td.textContent = '読み込めませんでした。GitHub Pages上で確認してください。 (' + error.message + ')';
    tr.append(td); tbody.append(tr);
  }
})();
</script>
</main>
</body>
</html>
